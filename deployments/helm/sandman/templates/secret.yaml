{{- if and .Values.api.token (not .Values.api.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandman.fullname" . }}
  labels:
    {{- include "sandman.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.secretKey }}: {{ .Values.api.token | quote }}
{{- end }}
